<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Proyek | ProjectHub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ProjectHub</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="projects.html">Daftar Proyek</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="add-project.html">Tambah Proyek</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="mb-4">
            <h1 class="h3 fw-bold">Tambah Proyek Baru</h1>
            <p class="text-secondary">
                Isi informasi berikut untuk menambahkan proyek.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <form id="projectForm">
                            <div class="mb-3">
                                <label for="projectName" class="form-label">
                                    Nama Proyek
                                </label>
                                <input type="text" class="form-control"
                                    id="projectName" name="projectName"
                                    placeholder="Contoh: Website Portfolio" required>
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">
                                    Kategori
                                </label>
                                <select class="form-select" id="category"
                                    name="category" required>
                                    <option value="">Pilih kategori</option>
                                    <option>Web Development</option>
                                    <option>Mobile App</option>
                                    <option>UI/UX Design</option>
                                    <option>Data Analysis</option>
                                    <option>Lainnya</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="deadline" class="form-label">
                                    Deadline
                                </label>
                                <input type="date" class="form-control"
                                    id="deadline" name="deadline" required>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">
                                    Status Proyek
                                </label>
                                <select class="form-select" id="status"
                                    name="status" required>
                                    <option value="">Pilih status</option>
                                    <option>Belum Mulai</option>
                                    <option>Berjalan</option>
                                    <option>Selesai</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    Deskripsi
                                </label>
                                <textarea class="form-control"
                                    id="description" name="description"
                                    rows="4"
                                    placeholder="Jelaskan tujuan proyek..."></textarea>
                            </div>

                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <button type="submit" class="btn btn-primary">
                                    Simpan Proyek
                                </button>
                                <a href="projects.html"
                                    class="btn btn-outline-secondary">
                                    Batal
                                </a>
                            </div>

                            <div id="formMessage" class="mt-3" role="status"></div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Form Validation -->
    <script>
        const projectForm = document.getElementById("projectForm");
        const formMessage = document.getElementById("formMessage");

        projectForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const projectName = document.getElementById("projectName").value.trim();

            if (!projectName) {
                formMessage.textContent = "Nama proyek wajib diisi.";
                formMessage.className = "mt-3 text-danger";
                return;
            }

            formMessage.textContent =
                "Form berhasil divalidasi! Data ini belum disimpan ke database.";
            formMessage.className = "mt-3 text-success";

            projectForm.reset();
        });
    </script>

</body>
</html>
